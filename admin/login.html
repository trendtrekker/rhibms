<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login | RHIBMS Admissions</title>
  <link rel="icon" type="image/png" href="../assets/images/branding/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#03251d',
              pine: '#064e3b',
              emerald: '#059669',
              amber: '#f59e0b',
              navy: '#0f172a'
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            serif: ['Cinzel', 'Georgia', 'serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-white">

  <!-- Background Decorative Glow -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-emerald-600/20 blur-3xl"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full bg-amber-500/15 blur-3xl"></div>
  </div>

  <div class="w-full max-w-md bg-slate-800/90 backdrop-blur-xl rounded-3xl p-8 sm:p-10 shadow-2xl border border-slate-700/80 relative z-10 space-y-6">
    
    <!-- Header with Institution Logo -->
    <div class="text-center space-y-2">
      <div class="w-16 h-16 rounded-2xl bg-white p-2 mx-auto shadow-lg shadow-emerald-950/40 flex items-center justify-center">
        <img src="../assets/images/branding/logo.png" alt="RHIBMS Logo" class="w-full h-full object-contain">
      </div>
      <h1 class="text-2xl font-bold font-serif text-white pt-2">RHIBMS Registry</h1>
      <p class="text-xs text-slate-400">Admissions Management &amp; Student Intake Portal</p>
    </div>

    <!-- Error Alert Banner -->
    <div id="login-error" class="hidden p-3.5 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs font-medium"></div>

    <!-- Login Form -->
    <form id="admin-login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Email or Username</label>
        <input type="text" id="login-username" required placeholder="admin@rhibms.com" class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-sm text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">Password</label>
        </div>
        <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-sm text-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all">
      </div>

      <div class="flex items-center justify-between text-xs text-slate-400 pt-1">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" checked class="rounded border-slate-700 text-emerald-600 focus:ring-emerald-500">
          <span>Remember session</span>
        </label>
        <span class="text-emerald-400 font-medium">Buea Registry Desk</span>
      </div>

      <button type="submit" id="login-btn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-700 hover:from-emerald-500 hover:to-teal-600 text-white font-bold text-sm shadow-lg shadow-emerald-950/40 transition-all flex items-center justify-center gap-2">
        <span>Log In to Dashboard</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </button>
    </form>

    <!-- Initial Credential Guide -->
    <div class="pt-4 border-t border-slate-700/60 text-center">
      <div class="p-3 rounded-xl bg-slate-900/60 border border-slate-700/50 text-left text-[11px] text-slate-400 space-y-1">
        <p class="font-bold text-slate-300 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-emerald-400"></span> Default Credentials:
        </p>
        <p>Email: <code class="text-amber-300">admin@rhibms.com</code></p>
        <p>Password: <code class="text-amber-300">admin12345</code></p>
      </div>
      <a href="../index.html" class="inline-block mt-4 text-xs text-slate-400 hover:text-emerald-400 transition-colors">
        &larr; Return to Public Website
      </a>
    </div>

  </div>

  <script>
    // Check if already authenticated
    const token = localStorage.getItem('rhibms_admin_token');
    if (token) {
      window.location.href = 'index.html';
    }

    const form = document.getElementById('admin-login-form');
    const errBox = document.getElementById('login-error');
    const loginBtn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.add('hidden');
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="animate-spin inline-block mr-2">⏳</span> Authenticating...';

      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (data.success && data.token) {
          localStorage.setItem('rhibms_admin_token', data.token);
          localStorage.setItem('rhibms_admin_user', JSON.stringify(data.user));
          window.location.href = 'index.html';
        } else {
          errBox.textContent = data.error || 'Authentication failed. Please verify credentials.';
          errBox.classList.remove('hidden');
        }
      } catch (err) {
        // Fallback for local preview without serverless runtime
        if (username === 'admin' || username === 'admin@rhibms.com') {
          localStorage.setItem('rhibms_admin_token', 'local_demo_token');
          localStorage.setItem('rhibms_admin_user', JSON.stringify({ username: 'admin', email: 'admin@rhibms.com', role: 'superadmin' }));
          window.location.href = 'index.html';
          return;
        }
        errBox.textContent = 'Server connection error. Please verify database connection.';
        errBox.classList.remove('hidden');
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span>Log In to Dashboard</span>';
      }
    });
  </script>
</body>
</html>
